<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曼荼羅オラクルカード</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* 神秘的で落ち着いたスピリチュアルな背景と基本設定 */
    body {
      font-family: 'Shippori Mincho', serif;
      background-color: #0b0410;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(60, 20, 100, 0.4) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(20, 40, 100, 0.4) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(100, 20, 60, 0.2) 0%, transparent 60%);
      color: #ede9f6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* 星屑のようなパーティクル効果をCSSで簡易表現 */
    .stars {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      pointer-events: none;
      background-image: 
        radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 40px 70px, rgba(255,255,255,0.6), rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, rgba(255,255,255,0.9), rgba(0,0,0,0)),
        radial-gradient(2px 2px at 150px 120px, rgba(255,255,255,0.4), rgba(0,0,0,0)),
        radial-gradient(1px 1px at 220px 80px, rgba(255,255,255,0.7), rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 300px 180px, rgba(255,255,255,0.5), rgba(0,0,0,0));
      background-size: 350px 350px;
      opacity: 0.6;
    }

    /* カードコンテナとフリップアニメーション */
    .card-wrapper {
      perspective: 1000px;
      flex: 1 1 0;
      max-width: 130px;
      aspect-ratio: 65 / 106;
      transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    /* 選択時の状態 */
    .card-wrapper.selected {
      flex: 0 0 auto;
      width: 65vw;
      max-width: 320px;
      z-index: 10;
    }

    /* 非選択時の状態（消える） */
    .card-wrapper.unselected {
      flex: 0 0 0;
      max-width: 0;
      margin: 0;
      padding: 0;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }

    .card-wrapper.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      width: 100%;
      height: 100%;
      position: absolute;
      backface-visibility: hidden;
      border-radius: 4.5%; /* 実際のカードの丸みに寄せる */
      box-shadow: 0 10px 25px rgba(0,0,0,0.6), 0 0 15px rgba(255,255,255,0.1) inset;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* 裏面（初期表示） */
    .card-front {
      transform: rotateY(0deg);
    }

    /* 表面（結果表示） */
    .card-back {
      transform: rotateY(180deg);
    }

    .card-front img, .card-back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ボタンや結果パネルの装飾 */
    .keyword-btn {
      background: linear-gradient(145deg, rgba(80, 40, 120, 0.6), rgba(40, 10, 80, 0.8));
      backdrop-filter: blur(8px);
      border: 1px solid rgba(180, 140, 255, 0.3);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }
    .keyword-btn:hover, .keyword-btn:active {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(180, 140, 255, 0.4);
      border-color: rgba(180, 140, 255, 0.6);
    }

    .fade-in {
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

          {
            word: '自然',
            message: 'このキーワードは、あなたが自然のリズムやサイクルに調和することを求めています。無理をせず、流れに身を任せることで、物事がスムーズに進んでいくでしょう。自然の中で過ごす時間を大切にし、自分自身をリセットする機会を持つことが重要です。',
            questions: [
              '◎私が自然のリズムに逆らっていると感じる瞬間はどんな時だろう?',
              '◎自分に無理をさせている要因は何だろう?',
              '◎自然の中で過ごしたら、どんなプラスの変化があるだろう?'
            ]
          },
          {
            word: '許可する',
            message: '自分自身や他者に対して許可を与えることは、成長と癒しのプロセスを促進します。このキーワードは、あなたが自分に対して厳しすぎたり、何かを許せずに苦しんでいることを示唆しています。今こそ、その枠を解き放ち、自由になる時です。自分を許し、他者を許すことで、新たなステージへと進むことができます。',
            questions: [
              '◎私が他者を許せないなら、何がそうさせているだろう?',
              '◎私が自分に許可を与えることをためらう理由は何だろう?',
              '◎自分を許すことで、どんな変化が起こるだろう?'
            ]
          }
        ]
      }
    ];

    // DOM要素
    const cardsContainer = document.getElementById('cards-container');
    const instructionText = document.getElementById('instruction-text');
    const keywordsSection = document.getElementById('keywords-section');
    const keywordsButtons = document.getElementById('keywords-buttons');
    const resultSection = document.getElementById('result-section');
    
    let isAnimating = false;
    let currentSelectedCardData = null;

    // アプリの初期化
    function initApp() {
      isAnimating = false;
      currentSelectedCardData = null;
      
      // UIのリセット
      instructionText.style.opacity = '1';
      instructionText.textContent = '直感で1枚選んでタップしてください';
      keywordsSection.classList.add('hidden');
      resultSection.classList.add('hidden');
      keywordsButtons.innerHTML = '';
      
      // カードの生成（3枚）
      cardsContainer.innerHTML = '';
      cardsContainer.style.height = 'auto'; // 高さを元に戻す
      
      for (let i = 0; i < 3; i++) {
        const cardWrapper = document.createElement('div');
        cardWrapper.className = 'card-wrapper';
        cardWrapper.onclick = () => handleCardClick(cardWrapper);
        
        cardWrapper.innerHTML = `
          <div class="card-inner">
            <div class="card-front">
              <!-- 指定された画像をロード (uramen.jpg を uramen.png に変更) -->
              <img src="uramen.png" alt="裏向きのカード">
            </div>
            <div class="card-back">
              <img src="" alt="表向きのカード" class="result-img">
            </div>
          </div>
        `;
        cardsContainer.appendChild(cardWrapper);
      }
    }

    // カード選択時の処理
    function handleCardClick(selectedCard) {
      if (isAnimating) return;
      isAnimating = true;

      // ガイダンステキストのフェードアウト
      instructionText.style.opacity = '0';
      
      // ランダムにカードデータを1つ選ぶ
      const randomIndex = Math.floor(Math.random() * cardsData.length);
      currentSelectedCardData = cardsData[randomIndex];
      
      // 選択されたカードの裏面（表示上は絵柄）に画像をセット
      const resultImg = selectedCard.querySelector('.result-img');
      resultImg.src = currentSelectedCardData.image;

      // 兄弟要素（選ばれなかったカード）をフェードアウト・縮小
      const allCards = cardsContainer.querySelectorAll('.card-wrapper');
      allCards.forEach(card => {
        if (card !== selectedCard) {
          card.classList.add('unselected');
        } else {
          card.classList.add('selected');
        }
      });

      // CSSトランジション（位置の移動と拡大）が終わるのを待ってからフリップ
      setTimeout(() => {
        selectedCard.classList.add('flipped');
        
        // フリップ完了後にキーワードを表示
        setTimeout(() => {
          showKeywords();
        }, 1000); // フリップにかかる時間+α
        
      }, 700); // flexの移動にかかる時間
    }

    // キーワードボタンの表示
    function showKeywords() {
      keywordsSection.classList.remove('hidden');
      
      currentSelectedCardData.keywords.forEach((keywordObj, index) => {
        const btn = document.createElement('button');
        btn.className = 'keyword-btn px-6 py-3 rounded-full text-white font-bold tracking-widest flex-1 min-w-[120px] max-w-[200px] text-center';
        btn.textContent = keywordObj.word;
        btn.onclick = () => showResult(keywordObj, btn);
        keywordsButtons.appendChild(btn);
      });
    }

    // 結果の表示
    function showResult(keywordObj, clickedBtn) {
      // 押されたボタン以外を消す（または無効化してスタイルを変える）
      const allBtns = keywordsButtons.querySelectorAll('button');
      allBtns.forEach(btn => {
        if (btn !== clickedBtn) {
          btn.style.display = 'none';
        } else {
          btn.classList.add('cursor-default');
          btn.onclick = null; // クリック無効化
        }
      });
      
      // ガイダンステキストの非表示
      keywordsSection.querySelector('p').style.display = 'none';

      // 結果データをDOMにセット
      document.getElementById('result-keyword').textContent = `「${keywordObj.word}」`;
      document.getElementById('result-message').textContent = keywordObj.message;
      
      const questionsContainer = document.getElementById('result-questions');
      questionsContainer.innerHTML = '';
      keywordObj.questions.forEach(q => {
        const li = document.createElement('li');
        li.textContent = q;
        li.className = 'flex items-start';
        questionsContainer.appendChild(li);
      });

      // 結果エリアをフェードイン
      resultSection.classList.remove('hidden');
      
      // スクロールを促すために少し下へスクロール
      setTimeout(() => {
        resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }

    // アプリのリセット
    function resetApp() {
      // スクロールを上に戻す
      window.scrollTo({ top: 0, behavior: 'smooth' });
      
      setTimeout(() => {
        // キーワードセクションの状態を元に戻す
        keywordsSection.querySelector('p').style.display = 'block';
        initApp();
      }, 500);
    }

    // 起動時の初期化
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
